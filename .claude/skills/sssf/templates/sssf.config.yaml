# sssf.config.yaml — the factory's agent roster. One agent, one prompt, one purpose.
# v1 runs the Pi coding agent only; coding_agent: claude_code arrives in v2.
#
# ONE LANE, ONE KEY, ON PURPOSE. Every agent below inherits a single
# `defaults.model`, and there is not one per-agent `model:` override in the file.
# That is the shape a stamped project can actually RUN on the minute it is
# stamped: `just demo` — the next step install.py prints — spends a few cents on
# one already-verified lane instead of failing five different ways.
#
# It replaces a four-provider starter roster (google/gemini-3.6-flash,
# fireworks/…/kimi-k3, openai/gpt-5.6-terra, openai/gpt-5.6-luna) that shipped
# here and did not resolve: `fireworks` is not a pi provider at all, `openai` in
# pi's catalog is really `openai-codex`, and a google-keyed Gemini lane is a paid
# per-token API — which the factory's own standing rules refuse. An un-edited
# deploy of that roster burned one dispatch per card onto unresolvable lanes and
# left every card visibly blocked. A roster you have to fix before the first run
# is not a default.
#
# CHANGE THIS LINE FIRST if `ollama-cloud/kimi-k2.7-code` is not a lane you have.
# `pi --list-models` prints every provider/id this box can actually resolve; the
# leading segment must be one of those providers (see references/config.md).
defaults:
  coding_agent: pi
  model: ollama-cloud/kimi-k2.7-code   # provider/id — a bare pattern is ambiguous across providers
  thinking: medium                 # off | minimal | low | medium | high | xhigh | max
  harness_engineering: []          # pi extensions loaded into the harness (-e)
  # Roster-wide allowlist; any agent may override with its own list.
  # NOTE: --tools filters extension and custom tools too, not just builtins. An agent
  # whose harness_engineering extension registers a tool MUST name that tool in its own
  # tools list — otherwise the extension loads and its tool is silently filtered out.
  tools:
    - read                         # read file contents
    - bash                         # execute bash commands
    - edit                         # find/replace edits
    - write                        # create/overwrite files
    - grep                         # search file contents  (pi default: OFF)
    - find                         # find files by glob     (pi default: OFF)
    - ls                           # list directories       (pi default: OFF)
  # Off-limits to every agent that does not name them in its own `writes`.
  # `tools` alone cannot protect these: bash runs `git checkout`, and write
  # reaches any path. An agent must not be able to edit the machinery that
  # decides whether its own work passed. Enforced in adw_modules/permissions.py.
  #
  # `writes:` per agent says what it may change IN THE REPO. It never restricts
  # the session runtime under data_dir — context_handoff/, envelopes, prompts,
  # raw output. Every agent can always write its own report; `writes: []` means
  # read-only with respect to the repo, not mute.
  protected_files:
    - adws/adw_modules/
    - adws/adw_sssf_config/
    - adws/adw_*.py
  data_dir: adws/adw_data          # runtime home: {data_dir}/sessions/{adw_id}/{agent_name}/

observability:
  db: adws/adw_data/sssf.db        # tracer writes here directly; the UI polls it
  poll_ms: 500                     # visualizer live-poll cadence

# One worktree per concurrently running agent, created outside the repo by
# the `worktree` phase every writing ADW opens with. `false` = pre-worktree
# behaviour (branch cut in the main checkout) — a written decision for a box
# that cannot support worktrees or a debugging session, never an accident.
# This whole block is optional — these are the code defaults (data_types.py's
# WorktreesConfig), written out so they are visible, not so they are required.
worktrees:
  enabled: true
  root: ""                         # "" = <parent of repo>/<repo-name>-worktrees
  trunk: integration                # what runs fork from and ff-merge into (main is human-owned)
  stale_after_minutes: 30           # a 'running' session silent this long is stale on rejoin

# engine.py (the always-on worker that runs the Board — `just engine`) reads
# two more OPTIONAL top-level blocks straight off this file. Absent, as here,
# is "no routing" — byte-for-byte the engine's behaviour with neither block.
#
# `lanes:` names each provider's concurrency limit — a slot counts one RUN;
# inner subagents draw on their parent's lane and are not counted. `--lanes`
# / $SSSF_LANES on the command line still override this on top.
# lanes:
#   ollama-cloud: { slots: 2 }
#   xai: { slots: 2 }
#
# `router.builder_pool` lets the BUILDER float across several models — the
# run goes to whichever listed lane has the most free slots, ties broken in
# the order written here. Every other agent always runs on its own
# `model:`/`defaults.model` — only the builder is ever pool-routed.
# router:
#   builder_pool:
#     - model: "ollama-cloud/kimi-k2.7-code"
#     - model: "xai/grok-4.5"

# ── quality: THE COMMANDS BOTH GATES RUN ─────────────────────────────────────
# Read by adw_modules/quality.py (the in-run checks) AND by adws/engine.py's
# merge gate (the suite re-run against the rebased tree before anything is
# merged). The defaults below are the FACTORY'S OWN - they verify the factory
# scaffolding that was just stamped into this repo, and nothing else.
#
# ⚠ POINT THESE AT YOUR PROJECT. Left as they are, your own tests never run at
# either gate, your own code is never typechecked, and a non-Python project
# gets no deterministic verification at all while every card still reads green.
# The starter suite (adws/tests/test_stamp.py) only checks that the stamp is
# intact.
#
# `{dev}` and `{scan}` expand to `uv run --project <tree> --group dev|scan` -
# the pinned toolchain, resolved against the tree being judged. A command that
# does not need them just does not use one. An empty string turns a check off,
# and it is recorded as NOT VERIFIED (never as a pass).
quality:
  lint: "{dev} ruff check ."
  typecheck: "{dev} mypy adws"
  test: "{dev} pytest -q adws/tests"
  scan: "{scan} skylos . --ai-defects --format concise"
  # A JavaScript/TypeScript project, for example, would say:
  #   lint: "npm run lint"
  #   typecheck: "npx tsc --noEmit"
  #   test: "npm test"
  # A Python project with its own suite beside the factory's:
  #   test: "{dev} pytest -q tests adws/tests"

agents:
  - name: planner
    thinking: high                 # model: inherits defaults.model (one lane, one key)
    color: "#a78bfa"                 # optional hex — the agent's lane color in the visualizer
    purpose: Turn a request into a plan the builder can implement without asking questions.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/planner/system.md
      user: adws/adw_data/prompt_engineering/planner/user.md
    harness_engineering:
      - adws/adw_data/harness_engineering/subagents.ts    # registers the four subagent_* tools below
    writes:                        # the plan is the only thing it may leave in the repo
      - specs/
    tools:                         # full recon + write for plan.md; no edit — the planner never touches repo files
      - read
      - grep
      - find
      - ls
      - bash
      - write
      - subagent_create            # extension tools MUST be named here or they are filtered out
      - subagent_continue
      - subagent_list
      - subagent_remove

  - name: builder
    color: "#22d3ee"
    purpose: Implement the plan exactly; report every changed file in the envelope.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/builder/system.md
      user: adws/adw_data/prompt_engineering/builder/user.md
    # No `writes` key: unrestricted, and the only agent that is. It still cannot
    # touch defaults.protected_files — the builder does not get to edit its own grader.
    tools:                         # the only agent that mutates the repo — everything on
      - read
      - grep
      - find
      - ls
      - bash
      - edit
      - write

  - name: scout
    color: "#fbbf24"
    purpose: Find and report where things live; change nothing.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/scout/system.md
      user: adws/adw_data/prompt_engineering/scout/user.md
    harness_engineering:
      - adws/adw_data/harness_engineering/subagents.ts    # registers the four subagent_* tools below
    writes: []                     # read-only, and now actually read-only: its findings
                                   # go to context_handoff/, which is runtime, not the repo
    tools:                         # search-heavy recon; write only so scout_findings.md lands without a bash heredoc
      - read
      - grep
      - find
      - ls
      - bash
      - write
      - subagent_create            # extension tools MUST be named here or they are filtered out
      - subagent_continue
      - subagent_list
      - subagent_remove

  # No tester agent: running the suite is a known command, so it is a kind="code"
  # phase over adw_modules/quality.py. See SKILL.md hard rule 8.

  - name: reviewer
    thinking: high                 # model: inherits defaults.model (one lane, one key)
    color: "#fb7185"
    purpose: Confirm that what was built is what was asked for; change nothing.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/reviewer/system.md
      user: adws/adw_data/prompt_engineering/reviewer/user.md
    writes: []                     # a reviewer that cannot fix cannot quietly fix — the
                                   # claim the tool list only implied, now enforced
    tools:                         # full read surface; write only for review.md, no edit
      - read
      - grep
      - find
      - ls
      - bash
      - write

  - name: documenter
    color: "#e879f9"                # model: inherits defaults.model (one lane, one key)
    purpose: Write up the change that was just made, from the diff; document only.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/documenter/system.md
      user: adws/adw_data/prompt_engineering/documenter/user.md
    writes:                        # documentation only — "document only" is a rule now,
      - app_docs/                  # not a line in a prompt the model may drift from.
      - docs/                      # Markdown anywhere, because docs live next to the
      - "**/*.md"                  # code they describe as often as in a docs folder.
      - "*.md"
    tools:                         # reads the diff and the code; writes/edits documentation only
      - read
      - grep
      - find
      - ls
      - bash
      - write
      - edit
