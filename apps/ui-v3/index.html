<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'"
    />
    <title>SDL Factory</title>
    <!--
      Everything the app needs is bundled locally by vite - no CDN, no remote
      script, style or font, ever. The three type families are system fonts
      (Iowan Old Style / system sans / Cascadia Mono) with stacked fallbacks,
      exactly as the v3 mocks declare them.

      'unsafe-inline' on script-src is load-bearing, not laziness. The server
      injects a one-line inline script carrying window.__APP_TOKEN__ just
      before this document's closing head tag when it serves
      apps/ui-v3/dist/index.html under --ui-v3, and that tag is the only way
      the SPA learns its CSRF token.

      Nothing in this file may contain the literal characters of a closing
      head tag inside a comment or a string: the server's injection writes
      immediately before the FIRST occurrence, so an occurrence inside a
      comment silently swallows the whole app.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
