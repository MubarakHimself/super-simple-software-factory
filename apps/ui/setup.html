<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <!-- Loaded via file:// (spec 4.3), never http - everything it needs
         (React, Tailwind, xterm.js) is bundled locally by vite.setup.config.ts,
         no CDN, no remote script/style/font ever, same as index.html. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'"
    />
    <title>SDL Factory Setup</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/setup/main.tsx"></script>
  </body>
</html>
